name: Lint

on: [push, pull_request]

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v1
        - uses: actions/setup-node@v2
          with:
            node-version: '23'
            cache: 'npm'
        - name: Install dependencies
          run: npm ci
        - name: Generate Prisma client
          run: npx prisma generate
        - name: Run lint
          run: npm run lint
